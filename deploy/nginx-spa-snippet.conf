# SPA fallback for eInvoice frontend (erechnung-smart).
# Include inside the server { } block that serves /var/www/erechnung-smart:
#
#   include /opt/eInvoice/deploy/nginx-security-snippet.conf;
#   include /opt/eInvoice/deploy/nginx-api-snippet.conf;
#   include /opt/eInvoice/deploy/nginx-spa-snippet.conf;
#
# And inside http { }:
#   include /opt/eInvoice/deploy/nginx-rate-limit-zone.conf;
#
# TLS termination belongs on this vhost (Let's Encrypt / existing cert). The API
# listens on 127.0.0.1 only and must not be exposed without HTTPS.
#
# Canonical host is https://erechnung-smart.de/. Include the www redirect:
#   include /opt/eInvoice/deploy/nginx-www-redirect-snippet.conf;

# Crawl files must not fall through to the SPA index.html.
# /metrics is the API Prometheus scrape on 127.0.0.1:8000 only — never the SPA.
location = /metrics {
    return 404;
}

location = /robots.txt {
    try_files $uri =404;
}

location = /sitemap.xml {
    try_files $uri =404;
}

location ~ ^/google[0-9a-f]+\.html$ {
    try_files $uri =404;
}

# Public URLs have no trailing slash (sitemap and canonical).
# Prerender stores each page as path/index.html. Matching $uri/ would 301
# /hilfe to /hilfe/, whose canonical points back at /hilfe.
location / {
    rewrite ^/(.+)/$ /$1 permanent;
    try_files $uri $uri/index.html /index.html;
}
