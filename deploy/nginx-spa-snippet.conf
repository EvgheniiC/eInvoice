# SPA fallback for eInvoice frontend (erechnung-smart).
# Include inside the server { } block that serves /var/www/erechnung-smart:
#
#   include /opt/eInvoice/deploy/nginx-security-snippet.conf;
#   include /opt/eInvoice/deploy/nginx-api-snippet.conf;
#   include /opt/eInvoice/deploy/nginx-spa-snippet.conf;
#
# And inside http { }:
#   include /opt/eInvoice/deploy/nginx-rate-limit-zone.conf;
#
# TLS termination belongs on this vhost (Let's Encrypt / existing cert). The API
# listens on 127.0.0.1 only and must not be exposed without HTTPS.

location / {
    try_files $uri $uri/ /index.html;
}
