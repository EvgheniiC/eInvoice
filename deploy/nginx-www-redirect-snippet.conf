# Redirect www → https://erechnung-smart.de (canonical host).
# Include inside the existing HTTPS server { } that currently answers both
# erechnung-smart.de and www.erechnung-smart.de:
#
#   include /opt/eInvoice/deploy/nginx-www-redirect-snippet.conf;
#
# HTTP www still 301s to https://www...; this then 301s to the apex host.
# After reload, prefer also pointing the HTTP www vhost straight at apex:
#   server_name www.erechnung-smart.de;
#   return 301 https://erechnung-smart.de$request_uri;

if ($host = www.erechnung-smart.de) {
    return 301 https://erechnung-smart.de$request_uri;
}
