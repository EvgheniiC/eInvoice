# Security and size limits for the eInvoice nginx site.
# Include inside the server { } block (HTTPS vhost):
#
#   include /opt/eInvoice/deploy/nginx-security-snippet.conf;
#
# Pair with nginx-spa-snippet.conf and nginx-api-snippet.conf.

client_max_body_size 10m;
client_body_timeout 30s;
keepalive_timeout 30s;

# Per-IP request ceiling for the whole vhost (API location may add a tighter burst).
limit_req_status 429;
limit_conn_status 429;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# blob: in frame-src and object-src is the in-page PDF preview (iframe src=blob:).
# CSP Level 3 does not treat the blob: scheme as 'self'. frame-ancestors stays 'none'.
# Google Analytics loads only after consent. The tag script and its collect calls
# need these hosts; everything else stays on this origin.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://www.google-analytics.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' https://www.googletagmanager.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; frame-src 'self' blob:; object-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
