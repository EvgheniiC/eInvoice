# Shared rate-limit zones. Include inside http { }:
#
#   include /opt/eInvoice/deploy/nginx-rate-limit-zone.conf;

limit_req_zone $binary_remote_addr zone=einvoice_api:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=einvoice_conn:10m;

# $uri drops the query string. Login and reset links carry a one-time token there.
log_format einvoice_redacted '$remote_addr - $remote_user [$time_local] '
                              '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                              '"$http_referer" "$http_user_agent"';
