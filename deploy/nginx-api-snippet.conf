# Reverse-proxy the FastAPI backend. Include inside the HTTPS server { } block:
#
#   include /opt/eInvoice/deploy/nginx-api-snippet.conf;
#
# Put the limit_req_zone in http { } (nginx-rate-limit-zone.conf).
# Prometheus /metrics is served on 127.0.0.1:8000 only and is not under /api/.

location /api/ {
    limit_req zone=einvoice_api burst=10 nodelay;
    limit_conn einvoice_conn 8;
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Powered-By;
    proxy_read_timeout 90s;
    proxy_send_timeout 30s;
    proxy_connect_timeout 5s;
    client_max_body_size 10m;
}
